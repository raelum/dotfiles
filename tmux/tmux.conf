# Allows finger scrolling
set -g mouse on

# Auto-enter copy mode on wheel up, but pass directly to nvim
bind -n WheelUpPane if-shell -F -t = "#{||:#{mouse_any_flag},#{alternate_on}}" "send-keys -M" "copy-mode -et="

# Enable focus events so nvim can detect pane switching
set -g focus-events on

# Enable clipboard synchronization with system clipboard
set -s set-clipboard on

# Use Vi keybindings in copy mode (v to select, y to copy to Android clipboard,
# Enter/q to exit)
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "termux-clipboard-set"
bind -T copy-mode-vi Enter send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Smart Ctrl+V
# - Pass raw Ctrl+V to Neovim (Visual Block mode)
# - Paste Android clipboard everywhere else
bind -n C-v if-shell -F "#{||:#{m:*vim*,#{pane_current_command}},#{alternate_on}}" \
    "send-keys C-v" \
    "run-shell \"tmux set-buffer \\\"\$(termux-clipboard-get)\\\"; tmux paste-buffer -p\""

# Status bar (clean look without localhost or date/time)
set -g status-right ""

# Clean up window name for glibc-loader binaries (show agy instead of ld-linux-aarch64.so.1)
set -g automatic-rename-format "#{s/ld-linux.*/agy/:pane_current_command}#{?pane_dead,[dead],}"


# ==========================================
# Tmux Plugin Manager (TPM) & Session Persistence
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore pane contents
set -g @resurrect-capture-pane-contents 'on'

# Auto-restore previous environment on tmux start
set -g @continuum-restore 'on'

# Auto-save interval in minutes (default 15)
set -g @continuum-save-interval '10'

# Also auto-save immediately whenever client detaches (e.g. Termux closed or minimized)
set-hook -g client-detached 'run -b "~/.tmux/plugins/tmux-resurrect/scripts/save.sh quiet"'

# Initialize TPM (must stay at the very bottom of .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
